services:
  - type: web
    name: pactpal-agentic-clearinghouse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_MODE
        value: hybrid
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
